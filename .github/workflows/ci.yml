name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: shellcheck + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          bash -n AutoVOD.sh
          bash -n install.sh
          bash -n buildRunDocker.sh
          bash -n legacy/AutoVOD-bash.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # AutoVOD.sh and buildRunDocker.sh must be clean; the 2.x script and
          # install.sh are legacy/best-effort, so only report their findings.
          shellcheck -S warning AutoVOD.sh buildRunDocker.sh
          shellcheck -S warning legacy/AutoVOD-bash.sh || true

  python:
    name: python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.12']
        exclude:
          - os: windows-latest
            python-version: '3.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile
        run: python -m py_compile autovod.py
      - name: unit + integration tests
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: |
          docker build -t autovod:test .
          docker run --rm autovod:test --version
          docker run --rm autovod:test -c /autovod/default.config --print-config >/dev/null
